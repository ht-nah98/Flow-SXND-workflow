# Backend lint policy (23/10 code check). Bug-finding rules plus modern syntax; import order is left alone on purpose:
# many imports are placed late to avoid import cycles.
target-version = "py312"
line-length = 120

[lint]
select = [
  "F",        # pyflakes: undefined / unused / shadowed names (F821, F811 found real bugs)
  "E9",       # syntax errors
  "B",        # bugbear
  "UP",       # pyupgrade: Optional[X] -> X | None, etc.
  "ASYNC",    # blocking calls in async code
  "RUF006",   # fire-and-forget create_task (use agent.utils.tasks.spawn)
]
ignore = [
  "B008",     # FastAPI File()/Depends() defaults are the framework's idiom
  # Left for later on purpose (23/10 review: none of these was a bug; each needs a per-site decision):
  "B904",     # raise ... from e inside except — traceback chaining only
  "B905",     # zip(strict=) — adding it can change behaviour
  "ASYNC109", # async functions taking a timeout parameter
  "ASYNC110", # sleep-polling loop
  "ASYNC230", # small file reads/writes in async functions
  "ASYNC240",
  "UP042",    # str+Enum -> StrEnum (unsafe fix)
]

[lint.per-file-ignores]
"agent/**/__init__.py" = ["F401"]   # re-exports
